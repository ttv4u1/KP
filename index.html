<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BPK Official | Full Announcement Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Orbitron:wght@400;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #d4af37;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(212, 175, 55, 0.3);
            --panel-max: 1000px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background: #000;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- BACKGROUND & WATERMARK --- */
        #bgCanvas { position: fixed; inset: 0; z-index: -2; background: black; }
        .jata-watermark {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(280px, 60vw, 700px);
            opacity: 0.06; z-index: -1; pointer-events: none;
        }

        /* --- NAVIGATION --- */
        .nav-bar {
            position: fixed; top: 10px; left: 50%;
            transform: translateX(-50%);
            z-index: 1000; display: none; gap: 8px;
            width: 95%; max-width: var(--panel-max);
            justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.8); padding: 8px 15px;
            border-radius: 50px; backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--gold); padding: 8px 12px;
            border-radius: 20px; cursor: pointer;
            font-family: 'Orbitron', sans-serif; font-size: 0.65rem;
            transition: 0.3s; text-transform: uppercase;
        }
        .glass-btn:hover { background: var(--gold); color: #000; }

        .search-box {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 8px 15px; color: #fff;
            outline: none; flex-grow: 1; max-width: 200px; font-size: 0.75rem;
        }

        /* --- FORMAL PANEL (LONG TEXT) --- */
        .formal-panel {
            background: var(--glass); backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            max-width: var(--panel-max); margin: 0 auto 40px;
            padding: clamp(20px, 5vw, 40px); border-radius: 15px;
            text-align: left; line-height: 1.8;
        }
        .formal-panel h2 { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 20px; }
        .staff-list { margin: 20px 0; padding-left: 20px; color: #ddd; font-size: 0.9rem; }
        .staff-list li { margin-bottom: 8px; border-bottom: 1px solid rgba(212,175,55,0.1); padding-bottom: 4px; }

        /* --- AUTOSLIDE SECTION --- */
        .slider-container {
            width: 100%; overflow: hidden; padding: 20px 0;
            margin-bottom: 40px;
        }
        .slider-track {
            display: flex; width: calc(240px * 20);
            animation: scroll 45s linear infinite;
        }
        .slider-track:hover { animation-play-state: paused; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(calc(-240px * 10)); } }

        .slide-item {
            width: 220px; height: 300px; margin: 0 10px;
            flex-shrink: 0; border-radius: 15px; overflow: hidden;
            border: 1px solid var(--glass-border); cursor: pointer; transition: 0.4s;
            position: relative;
        }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; }
        .slide-overlay { position: absolute; bottom: 0; width: 100%; background: linear-gradient(transparent, #000); padding: 15px; text-align: center; font-size: 0.7rem; }

        /* --- GRID --- */
        .grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 12px; max-width: var(--panel-max); margin: auto;
        }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; } }

        .card {
            background: var(--glass); border: 1px solid var(--glass-border);
            padding: 10px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .img-thumb { width: 100%; aspect-ratio: 3/4; overflow: hidden; border-radius: 8px; margin-bottom: 10px; }
        .img-thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* --- MODAL (TRUE RATIO) --- */
        #modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 6000; display: none; justify-content: center; align-items: center;
            padding: 15px; backdrop-filter: blur(20px);
        }
        .modal-box { width: 100%; max-width: 800px; text-align: center; }
        .modal-img-container img {
            max-width: 100%; max-height: 65vh; width: auto; height: auto;
            border: 2px solid var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
        }

        #landing { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #main-ui { display: none; opacity: 0; width: 100%; padding: 80px 15px 40px; transition: 1.5s; }
        footer { margin-top: 50px; text-align: center; color: var(--gold); font-size: 0.7rem; padding: 30px; border-top: 1px solid var(--glass-border); }
    </style>
</head>
<body>

    <audio id="audio" loop>
        <source src="https://github.com/ttv4u1/KP/raw/main/CC.mp3" type="audio/mpeg">
    </audio>

    <canvas id="bgCanvas"></canvas>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Coat_of_arms_of_Malaysia.svg/500px-Coat_of_arms_of_Malaysia.svg.png" class="jata-watermark">

    <!-- NAVIGATION -->
    <div class="nav-bar" id="nav">
        <button class="glass-btn" onclick="location.reload()">🏠</button>
        <input type="text" id="searchInput" class="search-box" placeholder="Cari..." onkeyup="searchStaff(this.value)">
        <button class="glass-btn" onclick="toggleLang()">🌐 <span id="langBtnText">English</span></button>
    </div>

    <!-- 1. LANDING SCREEN -->
    <div id="landing">
        <div style="display: flex; gap: 10px; margin-bottom: 25px;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Coat_of_arms_of_Malaysia.svg/500px-Coat_of_arms_of_Malaysia.svg.png" width="60">
            <img src="https://github.com/ttv4u1/KP/raw/main/DVS.svg" width="60">
            <img src="https://github.com/ttv4u1/KP/raw/main/Logo%20Penguatkuasa.png" width="60">
        </div>
        <h2 style="font-family:'Orbitron', sans-serif; letter-spacing: 5px; color:var(--gold); text-align: center;">BPK CORPORAL SYSTEM</h2>
        <button class="glass-btn" style="margin-top:40px; padding: 15px 45px; font-size: 1rem;" onclick="launch()">MULA / START</button>
    </div>

    <!-- 2. MAIN CONTENT AREA -->
    <div id="main-ui">
        
        <div class="formal-panel">
            <h2 id="formalGreet"></h2>
            <div id="formalBody"></div>
            <ul class="staff-list" id="staffList"></ul>
            <div id="formalClosing"></div>
        </div>

        <h3 style="text-align:center; font-family:'Orbitron', sans-serif; color:var(--gold); margin-bottom:15px; font-size: 0.8rem; letter-spacing: 2px;">HALL OF FAME</h3>
        <div class="slider-container">
            <div class="slider-track" id="sliderTrack"></div>
        </div>

        <div class="grid" id="staffGrid"></div>

        <footer>
            <p id="footerText"></p>
        </footer>
    </div>

    <!-- 3. MODAL -->
    <div id="modal" onclick="closeModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-img-container"><img id="fullImg" src=""></div>
            <div style="margin-top:20px;">
                <h2 id="fullName" style="font-family:'Orbitron', sans-serif; font-size: 1.3rem;"></h2>
                <p id="fullRank" style="color:var(--gold); font-weight: 700; margin-top: 10px;"></p>
                <button class="glass-btn" onclick="closeModal()" style="margin-top:25px;">TUTUP / CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        const staff = [
            { name: "EN. MOHD AZONI BIN BIDIN", ms: "Pembantu Penguat Kuasa KP2 ke Gred KP3", en: "Asst. Enforcement Officer KP2 to KP3", img: "https://github.com/ttv4u1/KP/raw/main/AZONI%20BIDIN.JPG" },
            { name: "EN. MOHD RIZAL BIN AHMAD", ms: "Pembantu Penguat Kuasa KP2 ke Gred KP3", en: "Asst. Enforcement Officer KP2 to KP3", img: "https://github.com/ttv4u1/KP/raw/main/RIZAL%20AHMAD.JPG" },
            { name: "EN. MD YUNUS BIN MD LAZIN @ MD LAZIM", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/YUNUS%20LAZIN.JPG" },
            { name: "EN. MUHAMAD SHAFFIK BIN SINIP", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/SHAFFIK%20SINIP.JPG" },
            { name: "EN. YUVARAJ A/L RAJENDRAN", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/YUVARAJ.JPG" },
            { name: "EN. NIK MUHAMAD AFIS BIN NIK ABDULLAH", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/AFIS%20NIK.JPG" },
            { name: "EN. MUHAMMAD RAIMI BIN ABU RAHIM", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/RAIMI%20ABU%20RAHIM.JPG" },
            { name: "EN. MUHAMMAD SHAFEQ BIN MD KAMIL", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/SHAFEQ%20MD%20KAMIL.JPG" },
            { name: "EN. RADZI BIN HASHIM", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/RADZI%20HASHIM.JPG" },
            { name: "EN. NURUL AZEAN BIN JA'AFAR", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/NURUL%20AZEAN.JPG" }
        ];

        const langData = {
            ms: {
                greet: "Assalamualaikum dan salam sejahtera,",
                intro: "Tuan/Puan,<br><br>Dengan sukacitanya dimaklumkan bahawa beberapa pegawai dari Bahagian Penguatkuasa Veterinar telah berjaya dalam urusan kenaikan pangkat seperti berikut:",
                closing: "Sehubungan itu, pihak BPK ingin merakamkan setinggi-tinggi tahniah dan penghargaan atas kejayaan tersebut. Semoga kenaikan pangkat ini menjadi pemangkin untuk terus memberikan perkhidmatan yang cemerlang dan berintegriti.<br><br>Sekali lagi, tahniah dan syabas👮🏻‍♂️<br><br>Sekian, terima kasih.<br><br><strong>BAHAGIAN PENGUATKUASA VETERINAR</strong><br>3 April 2026",
                footer: "JABATAN PERKHIDMATAN VETERINAR MALAYSIA",
                search: "Cari nama...",
                langBtn: "English"
            },
            en: {
                greet: "Greetings and Peace be upon you,",
                intro: "To whom it may concern,<br><br>We are pleased to announce that several officers from the Veterinary Enforcement Division have been successfully promoted as follows:",
                closing: "In this regard, BPK would like to express our heartiest congratulations and appreciation for this success. May this promotion serve as a catalyst to continue providing excellent and high-integrity service.<br><br>Once again, congratulations and well done👮🏻‍♂️<br><br>Thank you.<br><br><strong>VETERINARY ENFORCEMENT DIVISION</strong><br>April 3, 2026",
                footer: "DEPARTMENT OF VETERINARY SERVICES MALAYSIA",
                search: "Search name...",
                langBtn: "Bahasa Melayu"
            }
        };

        let currentLang = 'ms';

        // --- CORE FUNCTIONS ---
        function launch() {
            document.getElementById('audio').play();
            document.getElementById('landing').style.display = 'none';
            document.getElementById('nav').style.display = 'flex';
            document.getElementById('main-ui').style.display = 'block';
            setTimeout(() => document.getElementById('main-ui').style.opacity = '1', 50);
            updateUI();
            renderSlider();
        }

        function updateUI() {
            const d = langData[currentLang];
            document.getElementById('formalGreet').innerText = d.greet;
            document.getElementById('formalBody').innerHTML = d.intro;
            document.getElementById('formalClosing').innerHTML = d.closing;
            document.getElementById('footerText').innerText = d.footer;
            document.getElementById('langBtnText').innerText = d.langBtn;
            document.getElementById('searchInput').placeholder = d.search;

            const listEl = document.getElementById('staffList');
            listEl.innerHTML = '';
            staff.forEach((s, idx) => {
                const rank = currentLang === 'ms' ? s.ms : s.en;
                listEl.innerHTML += `<li>${idx+1}. ${s.name} – ${rank}</li>`;
            });
            renderStaff(staff);
        }

        function renderStaff(list) {
            const grid = document.getElementById('staffGrid');
            grid.innerHTML = '';
            list.forEach((s) => {
                grid.innerHTML += `
                    <div class="card" onclick="openFullView(${staff.indexOf(s)})">
                        <div class="img-thumb"><img src="${s.img}"></div>
                        <h3 style="font-size:0.75rem;">${s.name}</h3>
                    </div>`;
            });
        }

        function renderSlider() {
            const track = document.getElementById('sliderTrack');
            const items = [...staff, ...staff]; 
            track.innerHTML = '';
            items.forEach((s) => {
                track.innerHTML += `
                    <div class="slide-item" onclick="openFullView(${staff.indexOf(s)})">
                        <img src="${s.img}">
                        <div class="slide-overlay">${s.name}</div>
                    </div>`;
            });
        }

        function openFullView(i) {
            const s = staff[i];
            document.getElementById('fullImg').src = s.img;
            document.getElementById('fullName').innerText = s.name;
            document.getElementById('fullRank').innerText = currentLang === 'ms' ? s.ms : s.en;
            document.getElementById('modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; document.body.style.overflow = 'auto'; }
        function toggleLang() { currentLang = currentLang === 'ms' ? 'en' : 'ms'; updateUI(); renderSlider(); }
        function searchStaff(val) {
            const filtered = staff.filter(s => s.name.toLowerCase().includes(val.toLowerCase()));
            renderStaff(filtered);
        }

        // --- BACKGROUND ENGINE ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let pts = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            pts = [];
            for(let i=0; i<80; i++) pts.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2, v:Math.random()*0.4});
        }
        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = "#D4AF37";
            pts.forEach(p => {
                p.y -= p.v; if(p.y < 0) p.y = canvas.height;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        window.onresize = init; init(); draw();
    </script>
</body>
</html>

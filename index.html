<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BPK Official | Matrix Gold Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Orbitron:wght@400;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #d4af37;
            --gold-bright: #ffdf00;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(212, 175, 55, 0.3);
            --panel-max: 1000px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background: #000;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- BACKGROUND LAYERS --- */
        #bgCanvas { position: fixed; inset: 0; z-index: -3; background: #000; }
        #matrixCanvas { position: fixed; inset: 0; z-index: -2; opacity: 0.25; pointer-events: none; }
        
        .jata-watermark {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(300px, 70vw, 800px);
            opacity: 0.04; z-index: -1; pointer-events: none;
        }

        /* --- NAVIGATION --- */
        .nav-bar {
            position: fixed; top: 15px; left: 50%;
            transform: translateX(-50%);
            z-index: 1000; display: none; gap: 8px;
            width: 95%; max-width: var(--panel-max);
            justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.85); padding: 10px 20px;
            border-radius: 50px; backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: var(--gold); padding: 8px 15px;
            border-radius: 20px; cursor: pointer;
            font-family: 'Orbitron', sans-serif; font-size: 0.65rem;
            transition: 0.3s; text-transform: uppercase;
            display: flex; align-items: center; gap: 6px;
        }
        .glass-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold); }

        .search-box {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 8px 15px; color: #fff;
            outline: none; flex-grow: 1; max-width: 150px; font-size: 0.75rem;
        }

        /* --- LANDING PAGE --- */
        #landing {
            position: fixed; inset: 0; background: transparent; z-index: 5000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: 0.5s ease;
        }

        .logo-row-small {
            display: flex; gap: 15px; margin-bottom: 25px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
        }

        .logo-small { width: 45px; height: auto; transition: 0.4s; }

        .landing-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--gold);
            letter-spacing: 5px;
            font-size: clamp(0.9rem, 2.5vw, 1.4rem);
            text-align: center;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        .landing-address {
            position: absolute; bottom: 20px;
            font-size: 0.55rem; opacity: 0.6;
            text-align: center; width: 90%;
            letter-spacing: 1px; color: var(--gold); line-height: 1.5;
        }

        /* --- MAIN UI --- */
        #main-ui { display: none; opacity: 0; width: 100%; padding: 100px 15px 50px; transition: 0.8s; }

        .formal-panel {
            background: var(--glass); backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            max-width: var(--panel-max); margin: 0 auto 40px;
            padding: clamp(20px, 5vw, 45px); border-radius: 20px;
        }
        .formal-panel h2 { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 20px; font-style: italic; }
        .staff-list { margin: 20px 0; padding-left: 10px; color: #ececec; list-style: none; }
        .staff-list li { margin-bottom: 10px; border-bottom: 1px solid rgba(212,175,55,0.1); padding-bottom: 5px; font-size: 0.85rem; }

        /* --- SLIDER & GRID --- */
        .slider-container { width: 100%; overflow: hidden; padding: 20px 0; margin-bottom: 40px; }
        .slider-track { display: flex; width: calc(240px * 20); animation: scroll 40s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(calc(-240px * 10)); } }

        .slide-item {
            width: 220px; height: 300px; margin: 0 10px; flex-shrink: 0;
            border-radius: 15px; overflow: hidden; border: 1px solid var(--glass-border);
            cursor: pointer; position: relative;
        }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; }
        .slide-overlay { position: absolute; bottom: 0; width: 100%; background: linear-gradient(transparent, #000); padding: 15px; font-size: 0.7rem; text-align: center; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: var(--panel-max); margin: auto; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 25px; } }

        .card { background: var(--glass); border: 1px solid var(--glass-border); padding: 12px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: var(--gold); transform: translateY(-8px); }
        .img-thumb { width: 100%; aspect-ratio: 3/4; overflow: hidden; border-radius: 10px; margin-bottom: 12px; }
        .img-thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* --- MODAL --- */
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 6000; display: none; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(25px); }
        .modal-box { width: 100%; max-width: 850px; text-align: center; }
        .modal-img-container img { max-width: 100%; max-height: 65vh; width: auto; height: auto; border: 2px solid var(--gold); border-radius: 5px; }

        footer { margin-top: 60px; text-align: center; color: var(--gold); font-size: 0.75rem; padding: 40px; border-top: 1px solid var(--glass-border); opacity: 0.7; }
    </style>
</head>
<body>

    <!-- PLAYLIST MP3 (5 Songs) -->
    <audio id="audio"></audio>

    <canvas id="bgCanvas"></canvas>
    <canvas id="matrixCanvas"></canvas>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Coat_of_arms_of_Malaysia.svg/500px-Coat_of_arms_of_Malaysia.svg.png" class="jata-watermark">

    <!-- NAVIGATION BAR -->
    <div class="nav-bar" id="nav">
        <button class="glass-btn" onclick="goHome()">🏠 HOME</button>
        <button class="glass-btn" onclick="nextSong()">⏭️ <span id="songLabel">Song 1</span></button>
        <input type="text" id="searchInput" class="search-box" placeholder="Cari..." onkeyup="searchStaff(this.value)">
        <button class="glass-btn" onclick="toggleLang()">🌐 <span id="langBtnText">English</span></button>
    </div>

    <!-- 1. LANDING PAGE -->
    <div id="landing">
        <div class="logo-row-small">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Coat_of_arms_of_Malaysia.svg/500px-Coat_of_arms_of_Malaysia.svg.png" class="logo-small">
            <img src="https://github.com/ttv4u1/KP/raw/main/DVS.svg" class="logo-small">
            <img src="https://github.com/ttv4u1/KP/raw/main/Logo%20Penguatkuasa.png" class="logo-small">
        </div>
        <h1 class="landing-title">BPK CORPORAL SYSTEM</h1>
        <button class="glass-btn" style="margin-top:40px; padding: 18px 50px; border-radius: 40px;" onclick="launch()">MASUK / ENTER</button>
        
        <div class="landing-address">
            Bahagian Penguatkuasa Veterinar, Jabatan Perkhidmatan Veterinar Malaysia<br>
            Blok G, Wisma Tani, No. 28, Persiaran Perdana, Presint 4, 62630 Putrajaya
        </div>
    </div>

    <!-- 2. MAIN UI -->
    <div id="main-ui">
        <div class="formal-panel">
            <h2 id="formalGreet"></h2>
            <div id="formalBody"></div>
            <ul class="staff-list" id="staffList"></ul>
            <div id="formalClosing"></div>
        </div>

        <h3 style="text-align:center; font-family:'Orbitron', sans-serif; color:var(--gold); margin-bottom:20px; font-size: 0.8rem; letter-spacing: 3px;">EXCELLENCE GALLERY</h3>
        <div class="slider-container">
            <div class="slider-track" id="sliderTrack"></div>
        </div>

        <div class="grid" id="staffGrid"></div>

        <footer>
            <p id="footerText"></p>
        </footer>
    </div>

    <!-- 3. MODAL -->
    <div id="modal" onclick="closeModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-img-container"><img id="fullImg" src=""></div>
            <div style="margin-top:25px;">
                <h2 id="fullName" style="font-family:'Orbitron', sans-serif; font-size: clamp(1.1rem, 3vw, 1.6rem);"></h2>
                <p id="fullRank" style="color:var(--gold); font-weight: 700; margin-top: 10px;"></p>
                <button class="glass-btn" onclick="closeModal()" style="margin: 30px auto 0; padding: 10px 40px;">TUTUP</button>
            </div>
        </div>
    </div>

    <script>
        // --- JAPANESE MATRIX RAIN ---
        const mCanvas = document.getElementById('matrixCanvas');
        const mCtx = mCanvas.getContext('2d');
        let mWidth, mHeight, columns;
        const matrixChars = "アカサタナハマヤラワン0123456789";
        let drops = [];

        function initMatrix() {
            mWidth = window.innerWidth;
            mHeight = window.innerHeight;
            mCanvas.width = mWidth;
            mCanvas.height = mHeight;
            columns = Math.floor(mWidth / 20);
            drops = Array(columns).fill(1);
        }

        function drawMatrix() {
            mCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            mCtx.fillRect(0, 0, mWidth, mHeight);
            mCtx.fillStyle = '#d4af37';
            mCtx.font = '15px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                mCtx.fillText(text, i * 20, drops[i] * 20);
                if (drops[i] * 20 > mHeight && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }

        // --- PLAYLIST SYSTEM ---
        const playlist = [
            "https://github.com/ttv4u1/KP/raw/main/GM.mp3",
            "https://github.com/ttv4u1/KP/raw/main/CC.mp3",
            "https://github.com/ttv4u1/KP/raw/main/VVMB.mp3",
            "https://github.com/ttv4u1/KP/raw/main/LTD.mp3",
            "https://github.com/ttv4u1/KP/raw/main/EG.mp3"
        ];
        let currentSongIndex = 0;
        const audio = document.getElementById('audio');

        function initAudio() {
            audio.src = playlist[currentSongIndex];
            audio.play().catch(() => {});
            audio.onended = nextSong;
            updateSongLabel();
        }
        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            audio.src = playlist[currentSongIndex];
            audio.play();
            updateSongLabel();
        }
        function updateSongLabel() { document.getElementById('songLabel').innerText = `Track ${currentSongIndex + 1}`; }

        // --- STAFF DATA ---
        const staff = [
            { name: "EN. MOHD AZONI BIN BIDIN", ms: "Pembantu Penguat Kuasa KP2 ke Gred KP3", en: "Asst. Enforcement Officer KP2 to KP3", img: "https://github.com/ttv4u1/KP/raw/main/AZONI%20BIDIN.JPG" },
            { name: "EN. MOHD RIZAL BIN AHMAD", ms: "Pembantu Penguat Kuasa KP2 ke Gred KP3", en: "Asst. Enforcement Officer KP2 to KP3", img: "https://github.com/ttv4u1/KP/raw/main/RIZAL%20AHMAD.JPG" },
            { name: "EN. MD YUNUS BIN MD LAZIN @ MD LAZIM", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/YUNUS%20LAZIN.JPG" },
            { name: "EN. MUHAMAD SHAFFIK BIN SINIP", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/SHAFFIK%20SINIP.JPG" },
            { name: "EN. YUVARAJ A/L RAJENDRAN", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/YUVARAJ.JPG" },
            { name: "EN. NIK MUHAMAD AFIS BIN NIK ABDULLAH", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/AFIS%20NIK.JPG" },
            { name: "EN. MUHAMMAD RAIMI BIN ABU RAHIM", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/RAIMI%20ABU%20RAHIM.JPG" },
            { name: "EN. MUHAMMAD SHAFEQ BIN MD KAMIL", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/SHAFEQ%20MD%20KAMIL.JPG" },
            { name: "EN. RADZI BIN HASHIM", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/RADZI%20HASHIM.JPG" },
            { name: "EN. NURUL AZEAN BIN JA'AFAR", ms: "Pembantu Penguat Kuasa KP1 ke Gred KP2", en: "Asst. Enforcement Officer KP1 to KP2", img: "https://github.com/ttv4u1/KP/raw/main/NURUL%20AZEAN.JPG" }
        ];

        const langData = {
            ms: {
                greet: "Assalamualaikum dan salam sejahtera,",
                intro: "Tuan/Puan,<br><br>Dengan sukacitanya dimaklumkan bahawa beberapa pegawai dari Bahagian Penguatkuasa Veterinar telah berjaya dalam urusan kenaikan pangkat seperti berikut:",
                closing: "Sehubungan itu, pihak BPK ingin merakamkan setinggi-tinggi tahniah dan penghargaan atas kejayaan tersebut.<br><br>Sekali lagi, tahniah dan syabas👮🏻‍♂️<br><br>Sekian, terima kasih.<br><br><strong>BAHAGIAN PENGUATKUASA VETERINAR</strong><br>3 April 2026",
                footer: "JABATAN PERKHIDMATAN VETERINAR MALAYSIA",
                search: "Cari...", langBtn: "English"
            },
            en: {
                greet: "Greetings,",
                intro: "To whom it may concern,<br><br>We are pleased to announce that several officers from the Veterinary Enforcement Division have been successfully promoted as follows:",
                closing: "In this regard, BPK would like to express our heartiest congratulations.<br><br>Once again, congratulations and well done👮🏻‍♂️<br><br>Thank you.<br><br><strong>VETERINARY ENFORCEMENT DIVISION</strong><br>April 3, 2026",
                footer: "DEPARTMENT OF VETERINARY SERVICES MALAYSIA",
                search: "Search...", langBtn: "Bahasa Melayu"
            }
        };

        let currentLang = 'ms';

        // --- GLOBAL GOLD PARTICLES ---
        const gCanvas = document.getElementById('bgCanvas');
        const gCtx = gCanvas.getContext('2d');
        let gParts = [];

        function initGParts() {
            gCanvas.width = window.innerWidth;
            gCanvas.height = window.innerHeight;
            gParts = [];
            for (let i = 0; i < 80; i++) {
                gParts.push({
                    x: Math.random() * gCanvas.width,
                    y: Math.random() * gCanvas.height,
                    s: Math.random() * 2,
                    v: Math.random() * 0.3 + 0.1,
                    a: Math.random()
                });
            }
        }

        function drawGParts() {
            gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);
            gCtx.fillStyle = "#d4af37";
            gParts.forEach(p => {
                p.y -= p.v;
                if (p.y < 0) p.y = gCanvas.height;
                gCtx.globalAlpha = p.a;
                gCtx.beginPath(); gCtx.arc(p.x, p.y, p.s, 0, Math.PI * 2); gCtx.fill();
            });
            requestAnimationFrame(drawGParts);
        }

        // --- UI LOGIC ---
        function launch() {
            initAudio();
            document.getElementById('landing').style.display = 'none';
            document.getElementById('nav').style.display = 'flex';
            document.getElementById('main-ui').style.display = 'block';
            document.getElementById('matrixCanvas').style.opacity = '0.05'; // Dim matrix on main ui
            setTimeout(() => document.getElementById('main-ui').style.opacity = '1', 50);
            updateUI();
            renderSlider();
        }

        function goHome() {
            document.getElementById('main-ui').style.display = 'none';
            document.getElementById('nav').style.display = 'none';
            document.getElementById('landing').style.display = 'flex';
            document.getElementById('matrixCanvas').style.opacity = '0.25';
        }

        function updateUI() {
            const d = langData[currentLang];
            document.getElementById('formalGreet').innerText = d.greet;
            document.getElementById('formalBody').innerHTML = d.intro;
            document.getElementById('formalClosing').innerHTML = d.closing;
            document.getElementById('footerText').innerText = d.footer;
            document.getElementById('langBtnText').innerText = d.langBtn;
            document.getElementById('searchInput').placeholder = d.search;

            const listEl = document.getElementById('staffList');
            listEl.innerHTML = '';
            staff.forEach((s, idx) => {
                listEl.innerHTML += `<li>${idx+1}. ${s.name} – ${currentLang==='ms'?s.ms:s.en}</li>`;
            });
            renderStaff(staff);
        }

        function renderStaff(list) {
            const grid = document.getElementById('staffGrid');
            grid.innerHTML = '';
            list.forEach((s) => {
                grid.innerHTML += `<div class="card" onclick="openFullView(${staff.indexOf(s)})"><div class="img-thumb"><img src="${s.img}"></div><h3 style="font-size:0.7rem;">${s.name}</h3></div>`;
            });
        }

        function renderSlider() {
            const track = document.getElementById('sliderTrack');
            const items = [...staff, ...staff]; 
            track.innerHTML = '';
            items.forEach((s) => {
                track.innerHTML += `<div class="slide-item" onclick="openFullView(${staff.indexOf(s)})"><img src="${s.img}"><div class="slide-overlay">${s.name}</div></div>`;
            });
        }

        function openFullView(i) {
            const s = staff[i];
            document.getElementById('fullImg').src = s.img;
            document.getElementById('fullName').innerText = s.name;
            document.getElementById('fullRank').innerText = currentLang === 'ms' ? s.ms : s.en;
            document.getElementById('modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; document.body.style.overflow = 'auto'; }
        function toggleLang() { currentLang = currentLang === 'ms' ? 'en' : 'ms'; updateUI(); renderSlider(); }
        function searchStaff(val) {
            const filtered = staff.filter(s => s.name.toLowerCase().includes(val.toLowerCase()));
            renderStaff(filtered);
        }

        window.onresize = () => { initGParts(); initMatrix(); };
        initGParts(); drawGParts();
        initMatrix(); setInterval(drawMatrix, 50);
    </script>
</body>
</html>
